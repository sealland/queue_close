<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คิววันนี้ - Queue Close</title>
  <link rel="stylesheet" href="{{BASE_PATH}}/css/style.css">
  <script>window.__BASE_PATH__ = "{{BASE_PATH}}";</script>
</head>
<body class="app">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo">Q</div>
      <div>
        <div class="sidebar__title">Queue Close</div>
        <div class="sidebar__subtitle">จุดรับ P1</div>
      </div>
    </div>
    <nav class="sidebar__nav">
      <a href="{{BASE_PATH}}/" class="nav-link active">
        <svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        คิววันนี้
      </a>
      <a href="{{BASE_PATH}}/history" class="nav-link">
        <svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        ประวัติ / ย้อนหลัง
      </a>
    </nav>
    <div class="sidebar__footer">รีเฟรชอัตโนมัติทุก 15 วินาที</div>
  </aside>

  <div class="mobile-header">
    <div class="mobile-header__brand">
      <div class="sidebar__logo" style="width:32px;height:32px;font-size:0.9rem">Q</div>
      Queue Close
    </div>
  </div>

  <div class="app-main">
    <header class="page-header">
      <div class="page-header__left">
        <h1>คิววันนี้</h1>
        <p>รายการคิวที่ยังไม่ปิดจบ — Ship Point P1</p>
      </div>
      <div class="page-header__actions">
        <button id="btn-refresh" class="btn btn-ghost" type="button">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          รีเฟรช
        </button>
      </div>
    </header>

    <main class="content">
      <div id="error" class="alert alert--error hidden"></div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card__label">คิวรอปิดจบ</div>
          <div class="stat-card__value stat-card__value--accent" id="count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">อัปเดตล่าสุด</div>
          <div class="stat-card__value" style="font-size:1.1rem" id="last-update">-</div>
          <div class="stat-card__hint"><span class="live-dot"></span>Live</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">วันนี้</div>
          <div class="stat-card__value" style="font-size:1.1rem" id="today-date">-</div>
        </div>
      </div>

      <div id="queue-list" class="queue-list">
        <div class="empty-state">
          <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
          <p class="empty-state__title">กำลังโหลด...</p>
        </div>
      </div>
    </main>
  </div>

  <nav class="mobile-nav">
    <a href="{{BASE_PATH}}/" class="nav-link active">
      <svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      คิววันนี้
    </a>
    <a href="{{BASE_PATH}}/history" class="nav-link">
      <svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ประวัติ
    </a>
  </nav>

  <script src="{{BASE_PATH}}/js/common.js"></script>
  <script src="{{BASE_PATH}}/js/edit-modal.js"></script>
  <script src="{{BASE_PATH}}/js/queue.js"></script>
</body>
</html>
